<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10131b">
  <meta name="description" content="Feather Meteor — Minecraft 26.3 Fabric client download.">
  <title>Feather Meteor — 26.3 Fabric</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0e14;--panel:#141a25;--muted:#9aa6b8;--text:#f4f7fb;--accent:#9b8cff;--line:#273144}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#252044 0%,var(--bg) 55%);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text);display:grid;place-items:center;padding:28px}
    main{width:min(760px,100%);text-align:center}.card{background:linear-gradient(160deg,#171e2b,#111620);border:1px solid var(--line);border-radius:28px;padding:clamp(26px,6vw,54px);box-shadow:0 24px 80px #0008}
    .logo{width:104px;height:104px;object-fit:contain;border-radius:24px;margin:0 auto 18px;display:block;background:#20283a;padding:8px}
    .placeholder{width:104px;height:104px;margin:0 auto 18px;border-radius:24px;background:#252044;display:grid;place-items:center;font-size:42px}
    .eyebrow{color:#b9afff;font-size:12px;font-weight:800;letter-spacing:.18em;text-transform:uppercase}
    h1{font-size:clamp(34px,7vw,58px);line-height:1.05;margin:10px 0 12px;letter-spacing:-.04em}
    .sub{color:var(--muted);max-width:520px;margin:0 auto 26px}
    .tags{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px 0 30px}
    .tag{border:1px solid #39445a;background:#1b2332;color:#dce3f0;padding:7px 13px;border-radius:999px;font-size:13px}
    .download{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:linear-gradient(135deg,#a99bff,#8170f2);color:#10101a;text-decoration:none;font-weight:800;padding:15px 26px;border-radius:14px;min-width:220px;box-shadow:0 10px 30px #8878ff35;transition:transform .15s,filter .15s}
    .download:hover{transform:translateY(-2px);filter:brightness(1.08)}.download:focus-visible{outline:3px solid white;outline-offset:4px}
    .details{margin:28px auto 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;text-align:left;max-width:500px}
    .detail{padding:13px 15px;background:#0e131d;border:1px solid var(--line);border-radius:13px}.detail small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em}.detail strong{font-size:14px;overflow-wrap:anywhere}
    footer{color:#748096;font-size:12px;margin-top:22px}
    @media(max-width:480px){.details{grid-template-columns:1fr}.card{border-radius:22px}}
  </style>
</head>
<body>
<main>
  <section class="card">
    <div id="brandIcon">
      <img class="logo" src="icon.png" alt="Feather Meteor client icon"
           onerror="this.style.display='none';document.getElementById('fallback').style.display='grid'">
      <div class="placeholder" id="fallback" style="display:none" aria-hidden="true">✦</div>
    </div>
    <div class="eyebrow">Minecraft Fabric Client</div>
    <h1>Feather Meteor</h1>
    <p class="sub">A client build listed for Minecraft <strong>26.3</strong> with the <strong>Fabric</strong> loader.</p>
    <div class="tags">
      <span class="tag">Minecraft 26.3</span>
      <span class="tag">Fabric</span>
      <span class="tag">Client v3.1.0</span>
    </div>
    <a class="download" href="Feather-Meteor-3.1.0.jar" download>
      <span aria-hidden="true">↓</span> Download Client
    </a>
    <div class="details">
      <div class="detail"><small>Client</small><strong>Feather Meteor</strong></div>
      <div class="detail"><small>Game version</small><strong>26.3</strong></div>
      <div class="detail"><small>Mod loader</small><strong>Fabric</strong></div>
      <div class="detail"><small>File</small><strong>Feather-Meteor-3.1.0.jar</strong></div>
    </div>
  </section>
  <footer>Feather Meteor • Unofficial download page</footer>
</main>
</body>
</html>
